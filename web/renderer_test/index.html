<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renderer test</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: monospace;
      overflow: hidden;
    }
    #layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    #viewport {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      background: #000;
    }
    #test-canvas {
      background: #000;
      width: 100%;
      height: 100%;
      display: block;
    }
    #debug-panel {
      flex: 0 0 420px;
      max-width: 40vw;
      height: 100vh;
      overflow-y: auto;
      background: #0a0a0a;
      border-left: 1px solid #333;
      box-sizing: border-box;
      padding: 12px;
    }
    #debug-panel h1 {
      font-size: 13px;
      margin: 0 0 8px 0;
      color: #8f8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #debug-log {
      width: 100%;
      box-sizing: border-box;
      height: calc(100vh - 40px);
      resize: none;
      background: #000;
      color: #ddd;
      border: 1px solid #333;
      font-family: monospace;
      font-size: 12px;
      white-space: pre;
      padding: 8px;
    }
  </style>
</head>

<body>
  <div id="layout">
    <div id="viewport">
      <canvas id="test-canvas" width="384" height="216"></canvas>
    </div>
    <div id="debug-panel">
      <h1>debug</h1>
      <textarea id="debug-log" readonly wrap="off">booting…</textarea>
    </div>
  </div>
  <script defer src="main.dart.js"></script>
</body>

</html>
