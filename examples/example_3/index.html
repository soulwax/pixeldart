<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tidewatch</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ink: #eef3f6;
      --dim: #9fb0bc;
      --lamp: #ffd98a;
      --red: #ff6a55;
      --panel: rgba(6, 14, 22, 0.78);
    }
    html, body { margin: 0; height: 100%; background: #05090d; overflow: hidden; }
    body { font-family: "Palatino Linotype", Palatino, Georgia, serif; color: var(--ink); user-select: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; gap: 26px; align-items: baseline;
      padding: 12px 20px; pointer-events: none;
      font-size: 17px; letter-spacing: 0.08em; text-shadow: 0 1px 6px rgba(0, 0, 0, .9);
    }
    #clock { color: var(--lamp); min-width: 120px; }
    #weather { color: var(--dim); font-style: italic; }
    #wrecks { color: var(--red); letter-spacing: 0.3em; }
    #flares { margin-left: auto; color: #ff8a6a; letter-spacing: 0.15em; }

    #toast {
      position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%);
      font-size: 19px; font-style: italic; letter-spacing: 0.08em; color: var(--lamp);
      text-shadow: 0 0 10px rgba(0, 0, 0, .95); white-space: nowrap;
      opacity: 0; transition: opacity .4s; pointer-events: none;
    }
    #toast.show { opacity: 1; }

    #card {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      max-width: min(640px, calc(100vw - 32px)); box-sizing: border-box;
      padding: 28px 34px; background: var(--panel); text-align: center;
      border: 1px solid rgba(255, 217, 138, 0.35); box-shadow: 0 0 60px rgba(255, 217, 138, 0.08);
    }
    #card.hidden { display: none; }
    #card-title { margin: 0 0 16px; font-size: clamp(24px, 5vw, 34px); font-weight: normal; letter-spacing: 0.3em; color: var(--lamp); }
    #card-body { margin: 0; white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
    #credit { position: fixed; right: 12px; bottom: 8px; font-size: 11px; color: var(--dim); opacity: .6; }
    @media (max-width: 640px) {
      #hud { flex-wrap: wrap; gap: 8px 16px; font-size: 14px; padding: 10px 16px; }
      #toast { font-size: 15px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <span id="clock">16:30 day</span>
    <span id="weather">fair</span>
    <span id="home">⚓ 0 home</span>
    <span id="wrecks">···</span>
    <span id="flares">flares ✹✹✹</span>
  </div>
  <div id="toast"></div>
  <div id="card"><h1 id="card-title">TIDEWATCH</h1><p id="card-body">raising the island…</p></div>
  <div id="credit">models &amp; sounds: Kenney (CC0) · island, sea &amp; sky procedural · renderer: pixeldart</div>
  <script defer src="build/tidewatch.js"></script>
</body>
</html>
